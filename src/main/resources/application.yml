spring:
  application:
    name: kshitijas-creations-backend
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kshitijas_creations}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 150MB
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

app:
  public-site-url: ${PUBLIC_SITE_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:local-development-jwt-secret-change-me-1234567890}
    expiration: ${JWT_EXPIRATION:PT8H}
  bootstrap:
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
  whatsapp:
    admin-number: ${WHATSAPP_ADMIN_NUMBER:}
  storage:
    upload-directory: ${UPLOAD_DIRECTORY:./uploads}
  media:
    # public-base-url: ${PUBLIC_MEDIA_BASE_URL:http://localhost:8080/media}
    public-base-url: ${PUBLIC_MEDIA_BASE_URL:http://192.168.1.4:8080/media}
    max-image-size: 5MB
    max-video-size: 30MB
  cors:
    # allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://192.168.1.9:5173}
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://192.168.1.4:5173}
  swagger:
    enabled: ${SWAGGER_ENABLED:false}
  security:
    login-max-attempts: 5
    login-cooldown-minutes: 15
    order-rate-limit-per-hour: 10
  push:
    enabled: ${PUSH_ENABLED:true}
    public-key: ${VAPID_PUBLIC_KEY:BO_QEwNnXaQcFI1Qcr7tx8yJAErnzZcZFDNSWsutI3Wvuxu4pk-5KfWIH1yAdUGzymsJs8Jb0wkppwVUHhgkRnc}
    private-key: ${VAPID_PRIVATE_KEY:Wk46Ws8Eu60FacxXadEXYM3CYv_VCgO9jugno9JBSzQ}
    subject: ${VAPID_SUBJECT:mailto:admin@kshitijascreations.in}

springdoc:
  api-docs:
    enabled: ${app.swagger.enabled}
  swagger-ui:
    enabled: ${app.swagger.enabled}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%15.15t] [%X{requestId}] %-40.40logger{39} : %m%n"

